
<div class="top-line"></div>

<header>
  <h1>게시판</h1>
  <link rel="stylesheet" href="/">
</header>

<div class="container">

  <!-- 툴바 -->
    <div class="toolbar">
<a href="/boardWrite" class="btn-write">
      <svg width="13" height="13" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
        <path d="M12 5v14M5 12h14"/>
      </svg>
      글쓰기</a>
    </div>
    <table class="board-table">
  <thead>
    <tr>
      <th class="center">번호</th>
      <th>제목</th>
      <th>내용</th>
      <th>작성자</th>
      <th>날짜</th>
    </tr>
  </thead>

  <tbody>
    {% for post in posts %}
    <tr>
      <td class="center">{{ post.id }}</td>
      <td class="title">
        <a href="/boardDetail/{{ post.id }}">
          {{ post.title }}
        </a>
      </td>
      <td>{{ post.content }}</td>
        <td>김유진</td>
      <td>{{ post.createdAt }}</td>
    </tr>
    {% else %}
    <tr>
      <td colspan="5" class="center">게시글이 없습니다.</td>
    </tr>
    {% endfor %}
  </tbody>
</table>

    </div>
</div>

<style>
    

     :root {
      --bg:       #0e0e10;
      --surface:  #16161a;
      --border:   #2a2a30;
      --accent:   #c9a96e;
      --accent2:  #e8d5b0;
      --text:     #e8e8e4;
      --muted:    #6e6e72;
      --hover-bg: #1e1e24;
      --danger:   #c45c5c;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Noto Serif KR', serif;
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* ── 배경 노이즈 질감 ─────────────────── */
    body::before {
      content: '';
      position: fixed; inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.03'/%3E%3C/svg%3E");
      pointer-events: none; z-index: 0;
    }

    /* ── 상단 골드 라인 ───────────────────── */
    .top-line {
      height: 2px;
      background: linear-gradient(90deg, transparent, var(--accent), transparent);
    }

    /* ── 헤더 ────────────────────────────── */
    header {
      position: relative; z-index: 1;
      padding: 3rem 0 2.4rem;
      text-align: center;
      border-bottom: 1px solid var(--border);
    }
    
    header h1 {
      font-family: 'Playfair Display', serif;
      font-size: clamp(2rem, 5vw, 3.2rem);
      font-weight: 700;
      color: var(--accent2);
      letter-spacing: .04em;
    }
    header p.sub {
      margin-top: .5rem;
      font-size: .85rem;
      color: var(--muted);
      font-weight: 300;
    }

    /* ── 컨테이너 ─────────────────────────── */
    .container {
      max-width: 1080px;
      margin: 0 auto;
      padding: 0 1.5rem;
      position: relative; z-index: 1;
    }

    .title {
        font-weight: 500;
        color: var(--accent);
    }

    /* ── 툴바 ────────────────────────────── */
    .toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      padding: 1.8rem 0 1.2rem;
      flex-wrap: wrap;
    }
    .btn-write {
      display: flex; align-items: center; gap: .5rem;
      background: var(--accent);
      color: #0e0e10;
      border: none;
      font-family: 'Noto Serif KR', serif;
      font-size: .88rem;
      font-weight: 600;
      padding: .55rem 1.3rem;
      cursor: pointer;
      border-radius: 2px;
      letter-spacing: .04em;
      transition: background .2s, transform .15s;
      text-decoration: none;
    }
    .btn-write:hover { background: var(--accent2); transform: translateY(-1px); }
 /* ── 테이블 ───────────────────────────── */
    .board-table {
      width: 100%;
      border-collapse: collapse;
      border-top: 1px solid var(--accent);
      table-layout: fixed;
      word-break: break-word;
    }

    .board-table thead th{
      font-family: 'DM Mono', monospace;
      font-size: .72rem;
      letter-spacing: .15em;
      text-transform: uppercase;
      color: var(--muted);
      padding: .9rem 1rem;
      border-bottom: 1px solid var(--border);
      font-weight: 500;
      text-align: left;
    }
    .board-table thead th.center { text-align: center; }

    .board-table tbody tr {
      border-bottom: 1px solid var(--border);
      transition: background .18s;
      cursor: pointer;
      animation: rowIn .4s ease both;
    }
    .board-table tbody tr:hover { background: var(--hover-bg); }

    @keyframes rowIn {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* stagger */
    .board-table th:nth-child(1),
.board-table td:nth-child(1) {
  width: 80px;
}

.board-table th:nth-child(4),
.board-table td:nth-child(4) {
  width: 120px;
}

.board-table th:nth-child(5),
.board-table td:nth-child(5) {  
  width: 140px;
}
    .board-table td {
      padding: 1rem 1rem;
      font-size: .9rem;
      font-weight: 300;
      vertical-align: middle;
    }

.board-table th,
.board-table td {
  text-align: left;
}

.board-table th.center,
.board-table td.center {
  text-align: center;
}

/* ── 상세 카드 ───────────────────────── */
.detail-card {
  background: var(--surface);
  border: 1px solid var(--border);
  padding: 2rem;
  margin: 2rem 0 4rem;
  border-radius: 4px;
  animation: fadeIn .4s ease both;
}

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(10px); }
  to { opacity: 1; transform: translateY(0); }
}

/* 제목 */
.detail-header h2 {
  font-family: 'Playfair Display', serif;
  font-size: 1.8rem;
  color: var(--accent2);
  margin-bottom: 1rem;
}

/* 메타 정보 */
.meta {
  font-size: .75rem;
  color: var(--muted);
  display: flex;
  gap: 1.5rem;
  border-bottom: 1px solid var(--border);
  padding-bottom: 1rem;
  margin-bottom: 1.5rem;
}

/* 내용 */
.detail-content {
  font-size: .95rem;
  line-height: 1.8;
  font-weight: 300;
  white-space: pre-line;
  margin-bottom: 2rem;
}

/* 버튼 영역 */
.detail-actions {
  display: flex;
  justify-content: flex-end;
}

/* 외곽 버튼 */
.btn-outline {
  border: 1px solid var(--accent);
  color: var(--accent);
  padding: .5rem 1.3rem;
  text-decoration: none;
  font-size: .85rem;
  letter-spacing: .05em;
  transition: all .2s;
}

.btn-outline:hover {
  background: var(--accent);
  color: #0e0e10;
}


</style>

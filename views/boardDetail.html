<div class="top-line"></div>

<header>
  <h1>게시글 상세</h1>
  <link rel="stylesheet" href="/style.css">
</header>

<div class="container">

  <div class="detail-card">

    <div class="detail-header">
      <h2>{{ post.title }}</h2>
      <div class="meta">
        <span>작성자: 김유진</span>
        <span>작성일: {{ post.createdAt }}</span>
      </div>
    </div>

    <div class="detail-content">
      {{ post.content }}
    </div>

    <div class="detail-actions">
      <a href="/" class="btn-outline">목록으로</a>
    </div>

  </div>

</div>

<style>
        :root {
        --bg:       #0e0e10;
        --surface:  #16161a;
        --border:   #2a2a30;
        --accent:   #c9a96e;
        --accent2:  #e8d5b0;
        --text:     #e8e8e4;
        --muted:    #6e6e72;
        --hover-bg: #1e1e24;
        }
    
        *{box-sizing:border-box;margin:0;padding:0;}
    
        body{
        background:var(--bg);
        color:var(--text);
        font-family:'Noto Serif KR',serif;
        min-height:100vh;
        }
    
        .top-line{
        height:2px;
        background:linear-gradient(90deg,transparent,var(--accent),transparent);
        }
    
        header{
        padding:3rem 0 2rem;
        text-align:center;
        border-bottom:1px solid var(--border);
        }
    
        header h1{
        font-family:'Playfair Display',serif;
        font-size:2.5rem;
        color:var(--accent2);
        }
/* ── 상세 카드 ───────────────────────── */
.detail-card {
  background: var(--surface);
  border: 1px solid var(--border);
  padding: 2rem;
  margin: 2rem 0 4rem;
  border-radius: 4px;
  animation: fadeIn .4s ease both;
}

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(10px); }
  to { opacity: 1; transform: translateY(0); }
}

/* 제목 */
.detail-header h2 {
  font-family: 'Playfair Display', serif;
  font-size: 1.8rem;
  color: var(--accent2);
  margin-bottom: 1rem;
}

/* 메타 정보 */
.meta {
  font-size: .75rem;
  color: var(--muted);
  display: flex;
  gap: 1.5rem;
  border-bottom: 1px solid var(--border);
  padding-bottom: 1rem;
  margin-bottom: 1.5rem;
}

/* 내용 */
.detail-content {
  font-size: .95rem;
  line-height: 1.8;
  font-weight: 300;
  white-space: pre-line;
  margin-bottom: 2rem;
}

/* 버튼 영역 */
.detail-actions {
  display: flex;
  justify-content: flex-end;
}

/* 외곽 버튼 */
.btn-outline {
  border: 1px solid var(--accent);
  color: var(--accent);
  padding: .5rem 1.3rem;
  text-decoration: none;
  font-size: .85rem;
  letter-spacing: .05em;
  transition: all .2s;
}

.btn-outline:hover {
  background: var(--accent);
  color: #0e0e10;
}

</style>
